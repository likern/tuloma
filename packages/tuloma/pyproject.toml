[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "tuloma"
version = "0.1.0"
description = "Low-level Rust LOS module over NumPy; geometric methods are placeholders"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2.5,<2.6"]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "tuloma._los"
