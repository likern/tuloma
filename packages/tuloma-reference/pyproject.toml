[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "tuloma-reference"
version = "0.1.0"
description = "Existing NumPy reference implementation used by the Tuloma journal"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<2.6"]

[tool.setuptools.packages.find]
where = ["src"]
