name: Monorepo checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo test -p tuloma-los --locked
      - run: cargo check --workspace --locked

  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        numpy: ['2.2.5', '2.5.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'numpy==${{ matrix.numpy }}' 'pytest==9.2.0' 'maturin==1.16.0'
      - run: maturin build --release --locked --manifest-path packages/tuloma/Cargo.toml --out .cache/native-wheels
      - run: python -m pip install --no-deps .cache/native-wheels/*.whl
      - run: python -m pytest packages/tuloma/tests -q
      - run: python tests/browser/smoke.py
      - run: maturin sdist --manifest-path packages/tuloma/Cargo.toml --out .cache/sdist
      - uses: actions/upload-artifact@v4
        with:
          name: native-py${{ matrix.python }}-numpy${{ matrix.numpy }}
          path: |
            .cache/native-wheels/*.whl
            .cache/sdist/*.tar.gz

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r tools/browser/requirements.txt
      - run: ./tools/browser/build.sh
      - run: npm ci --prefix tools/browser --ignore-scripts --no-audit
      - run: npm test --prefix tools/browser
      - uses: actions/upload-artifact@v4
        with:
          name: pyodide-0.29.4-wheel
          path: .cache/wasm-wheels/*.whl

  journal:
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
      - run: python -m pip install -r tools/journal/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pyodide-0.29.4-wheel
          path: .cache/wasm-wheels
      - run: python tools/browser/stage.py .cache/wasm-wheels
      - run: ./build.sh
      - run: python -B -m unittest discover -s packages/tuloma-reference/tests
      - run: python tools/journal/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: journal-static
          path: dist/
